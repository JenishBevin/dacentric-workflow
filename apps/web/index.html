<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Onerra</title>

    <!-- PWA: lets "Add to Home Screen" (iOS Safari / Android Chrome) install
         a real app icon that launches full-screen, no browser chrome.
         Installing from the login page should launch straight back into
         the login page (for employees); installing from anywhere else
         should launch the public Onerra home page. Since this is one SPA
         with one index.html, that's done by swapping the manifest link
         (and iOS's own title meta, which ignores the manifest) based on
         the URL this page was loaded at — before the browser evaluates
         installability, so it must run synchronously, here, not in React. -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- iOS ignores the manifest's icons/display mode — these are what it
         actually reads for the home-screen icon and standalone launch. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="apple-app-title" name="apple-mobile-web-app-title" content="Onerra" />
    <script>
      if (location.pathname.startsWith("/login-portal-uae2026")) {
        document.getElementById("app-manifest").setAttribute("href", "/manifest-employee.webmanifest");
        document.getElementById("apple-app-title").setAttribute("content", "QPlus");
        document.title = "QPlus";
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <!-- Populated at container startup from the runtime VITE_API_BASE_URL env
         var (see apps/web/Dockerfile's entrypoint) — lets a single Docker
         image be deployed against different API URLs without rebuilding. -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
